<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="text-center mb-4">🔐 Вхід</h2>
    <form method="post" action="/auth/login" class="card p-4 shadow-sm">
    <div class="mb-3">
        <label for="identifier" class="form-label">Ім’я користувача або Email</label>
        <input type="text" id="identifier" name="identifier" class="form-control" placeholder="Ваш нік або email" required>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Пароль</label>
        <input type="password" id="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Увійти</button>
</form>

{% if error %}
    <div class="alert alert-danger mt-3 text-center">{{ error }}</div>
{% endif %}


    {% if error %}
        <div class="alert alert-danger mt-3 text-center">{{ error }}</div>
    {% endif %}
</div>
</body>
</html>
