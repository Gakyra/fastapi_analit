<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Аналитика</title>
</head>
<body>
    <h1>Аналитика</h1>

    <form method="post" action="/analytics/view">
        <label for="query">Введите запрос:</label><br>
        <input type="text" id="query" name="query" required><br><br>
        <input type="submit" value="Анализировать">
    </form>

    {% if error %}
        <h2 style="color: red;">Ошибка:</h2>
        <p>{{ error }}</p>
    {% endif %}

    {% if result %}
        <h2>Результат:</h2>
        <p>{{ result }}</p>
    {% endif %}
</body>
</html>
