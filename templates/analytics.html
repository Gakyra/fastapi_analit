<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Аналіз активу</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="mb-4 text-center">🔍 Проведіть аналіз активу</h2>
    <form method="post" action="/analytics/view" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label for="query" class="form-label">Опишіть ваш запит</label>
            <input type="text" id="query" name="query" class="form-control" placeholder="Наприклад: Прогноз BTC на тиждень" required>
        </div>

        <div class="mb-3">
            <label for="asset" class="form-label">Оберіть актив</label>
            <select id="asset" name="asset" class="form-select">
                <option value="BTC">Bitcoin (BTC)</option>
                <option value="AAPL">Apple (AAPL)</option>
                <option value="EURUSD">EUR/USD</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="mode" class="form-label">Тип аналізу</label>
            <select id="mode" name="mode" class="form-select">
                <option value="finance">Фінансовий</option>
                <option value="psychology">Психологічний</option>
                <option value="forecast">Прогноз</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Аналізувати</button>
    </form>

    {% if error %}
        <div class="alert alert-danger mt-4">{{ error }}</div>
    {% endif %}

    {% if result %}
        <div class="alert alert-success mt-4">
            <h5>Результат:</h5>
            <p>{{ result }}</p>
        </div>
    {% endif %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
