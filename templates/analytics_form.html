<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Обрати актив для аналізу</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="text-center mb-4">🔍 Оберіть актив для аналізу</h2>
    <form method="post" action="/analytics/view" class="text-center">
        <select name="asset_id" class="form-select w-50 mx-auto mb-3">
            {% for id, name in assets.items() %}
            <option value="{{ id }}">{{ name }}</option>
            {% endfor %}
        </select>
        <button type="submit" class="btn btn-primary">📊 Показати аналіз</button>
    </form>
</div>
</body>
</html>
