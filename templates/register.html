<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="text-center mb-4">📝 Реєстрація</h2>
    <form method="post" action="/auth/register" class="card p-4 shadow-sm">
    <div class="mb-3">
        <label for="username" class="form-label">Ім’я користувача</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Ваш нік" required>
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Пароль</label>
        <input type="password" id="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-success">Зареєструватися</button>
</form>

</div>
</body>
</html>
