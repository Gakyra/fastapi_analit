<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Обране</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="text-center mb-4">❤️ Ваші обрані активи</h2>
    {% if assets %}
    <ul class="list-group">
        {% for asset in assets %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <a href="/assets/{{ asset.id }}">{{ asset.name }}</a>
            <a href="/assets/{{ asset.id }}" class="btn btn-sm btn-outline-info">Деталі</a>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <div class="alert alert-info text-center">У вас поки немає обраних активів.</div>
    {% endif %}
</div>
</body>
</html>
