<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Активи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        function filterAssets(type) {
            const rows = document.querySelectorAll(".asset-row");
            rows.forEach(row => {
                row.style.display = (type === "All" || row.dataset.type === type) ? "" : "none";
            });
        }
    </script>
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="text-center mb-4">📊 Активи</h2>

    <div class="mb-3 text-center">
        <button class="btn btn-outline-primary mx-1" onclick="filterAssets('All')">Всі</button>
        <button class="btn btn-outline-success mx-1" onclick="filterAssets('Crypto')">Крипто</button>
        <button class="btn btn-outline-info mx-1" onclick="filterAssets('Stock')">Акції</button>
        <button class="btn btn-outline-warning mx-1" onclick="filterAssets('Meme')">Мем</button>
    </div>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>Назва</th>
                <th>Ціна</th>
                <th>Зміна (24г)</th>
            </tr>
        </thead>
        <tbody>
            {% for asset in assets %}
            <tr class="asset-row" data-type="{{ asset.type }}">
                <td>{{ asset.name }}</td>
                <td>${{ "%.4f"|format(asset.price) }}</td>
                <td style="color: {{ 'green' if asset.change >= 0 else 'red' }}">
                    {{ asset.change }}%
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
